<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Aurelia Dental · Clinic Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dashboard.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23111214'/><path d='M10 9c2-1.5 4-1 6 0 2-1 4-1.5 6 0 2 2 1.5 6 .5 8.5-.8 2.2-1 6-2.5 6.5-1.6.6-1.8-4-4-4s-2.4 4.6-4 4c-1.5-.5-1.7-4.3-2.5-6.5C8.5 15 8 11 10 9z' fill='%23d4f45a'/></svg>" />
</head>
<body>
  <div class="app">
    <aside class="side">
      <a class="brand" href="../"><span class="brand-mark"></span><span>Aurelia<b>.</b></span></a>
      <nav class="side-nav" id="nav">
        <a href="#overview" data-view="overview"><i>◎</i>Overview</a>
        <a href="#calendar" data-view="calendar"><i>▦</i>Calendar</a>
        <a href="#appointments" data-view="appointments"><i>◷</i>Appointments</a>
        <a href="#patients" data-view="patients"><i>☺</i>Patients</a>
        <a href="#billing" data-view="billing"><i>₹</i>Billing</a>
        <a href="#offers" data-view="offers"><i>✦</i>Offers</a>
        <a href="#messages" data-view="messages"><i>✉</i>Messages</a>
      </nav>
      <div class="side-foot">
        <div class="demo-card">
          <b>Demo mode</b>
          <p>Sample data, saved in this browser only. Nothing is charged or sent.</p>
          <button class="link-btn" data-action="reset">Reset demo data</button>
        </div>
        <a class="side-link" href="../">← View website</a>
      </div>
    </aside>

    <main class="main">
      <header class="top">
        <div>
          <p class="crumb" id="crumb">Aurelia Dental · Sushant Lok</p>
          <h1 id="title">Overview</h1>
        </div>
        <div class="top-actions">
          <span class="sync" title="Bookings are mirrored to the clinic's Google Calendar (simulated in demo)"><span class="dot"></span>Google Calendar synced</span>
          <button class="btn ghost" data-action="new-appt">+ Appointment</button>
          <button class="btn dark" data-action="new-bill">+ New bill</button>
        </div>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>

  <div class="modal-wrap" id="modal" hidden>
    <div class="modal-bg" data-action="close"></div>
    <div class="modal" role="dialog" aria-modal="true" id="modalBox"></div>
  </div>
  <div class="drawer-wrap" id="drawer" hidden>
    <div class="modal-bg" data-action="close-drawer"></div>
    <aside class="drawer" id="drawerBox"></aside>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="tip" id="tip" hidden></div>
  <div id="print"></div>

  <script src="../assets/config.js"></script>
  <script src="../assets/demo-store.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
